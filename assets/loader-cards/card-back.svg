<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 15 806 1330" fill="none" role="img" aria-labelledby="title">
  <title id="title">Navy SO/FACET card with brushed silver border</title>
  <defs>
    <path id="shield" d="M543 42 C522 77 499 121 474 121 C451 121 440 106 432 96 C418 78 362 107 331 124 C278 154 229 194 179 203 Q163 205 163 222 V1097 C163 1170 232 1191 337 1207 C436 1223 489 1234 543 1318 C597 1234 650 1223 749 1207 C854 1191 923 1170 923 1097 V222 Q923 205 907 203 C857 194 808 154 755 124 C724 107 668 78 654 96 C646 106 635 121 612 121 C587 121 564 77 543 42 Z"/>
    <path id="inset" d="M543 103 C521 140 499 155 474 155 C450 155 428 145 416 127 C332 141 269 211 193 232 V1090 C193 1148 244 1167 343 1183 C442 1198 493 1217 543 1270 C593 1217 644 1198 743 1183 C842 1167 893 1148 893 1090 V232 C817 211 754 141 670 127 C658 145 636 155 612 155 C587 155 565 140 543 103 Z"/>
    <linearGradient id="silver" x1="150" y1="0" x2="936" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#777b7b"/><stop offset=".035" stop-color="#f5f4ef"/><stop offset=".14" stop-color="#626665"/><stop offset=".25" stop-color="#f4f2ec"/><stop offset=".39" stop-color="#a8a9a7"/><stop offset=".5" stop-color="#fdfcf7"/><stop offset=".64" stop-color="#797d7c"/><stop offset=".77" stop-color="#eeede8"/><stop offset=".93" stop-color="#969996"/><stop offset="1" stop-color="#e2e3df"/>
    </linearGradient>
    <linearGradient id="reflections" x1="0" y1="40" x2="0" y2="1320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".72"/><stop offset=".13" stop-color="#000" stop-opacity=".1"/><stop offset=".2" stop-color="#fff" stop-opacity=".35"/><stop offset=".34" stop-color="#000" stop-opacity=".38"/><stop offset=".48" stop-color="#fff" stop-opacity=".35"/><stop offset=".61" stop-color="#000" stop-opacity=".42"/><stop offset=".73" stop-color="#fff" stop-opacity=".65"/><stop offset=".86" stop-color="#000" stop-opacity=".3"/><stop offset=".92" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#111" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="navy" cx="43%" cy="30%" r="85%">
      <stop stop-color="#031c2b"/><stop offset=".55" stop-color="#001420"/><stop offset="1" stop-color="#000b12"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".68 .9" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <filter id="brush" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feTurbulence baseFrequency=".006 .85" numOctaves="2" seed="4" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <clipPath id="surface"><use href="#shield"/></clipPath>
    <linearGradient id="logoSilver" x1="0" y1="0" x2=".3" y2="1">
      <stop stop-color="#fbfaf5"/><stop offset=".26" stop-color="#aaaca9"/><stop offset=".53" stop-color="#e4e3de"/><stop offset=".74" stop-color="#8e918e"/><stop offset="1" stop-color="#c9cbc6"/>
    </linearGradient>
    <path id="mark" fill-rule="evenodd" d="M478 1091 L502 1065 H584 L608 1091 V1158 H565 L583 1126 H554 L543 1103 L532 1126 H503 L521 1158 H478 Z M503 1102 H583 V1098 L574 1086 H512 L503 1098 Z"/>
  </defs>
  <!-- The navy panel, grain and frame are all vector-native. -->
  <use href="#shield" fill="url(#navy)"/>
  <g clip-path="url(#surface)"><rect x="145" y="22" width="795" height="1312" fill="url(#navy)" filter="url(#grain)"/></g>
  <!-- Layered strokes form the rolled outer and inner metal bevels. -->
  <use href="#shield" stroke="#101517" stroke-width="32" stroke-linejoin="round"/>
  <use href="#shield" stroke="#858985" stroke-width="28" stroke-linejoin="round"/>
  <use href="#shield" stroke="#eeeee8" stroke-width="25" stroke-linejoin="round"/>
  <use href="#shield" stroke="#5b5e5b" stroke-width="21" stroke-linejoin="round"/>
  <use href="#shield" stroke="url(#silver)" stroke-width="18" stroke-linejoin="round" filter="url(#brush)"/>
  <use href="#shield" stroke="url(#reflections)" stroke-width="17" stroke-linejoin="round"/>
  <use href="#shield" stroke="#f5f4ed" stroke-opacity=".55" stroke-width=".75" transform="translate(543 680) scale(1.028 1.016) translate(-543 -680)"/>
  <use href="#shield" stroke="#d5d7d0" stroke-opacity=".6" stroke-width=".9" transform="translate(543 680) scale(.977 .987) translate(-543 -680)"/>
  <!-- Hand-shaped inset rules follow the reference's separate corner sweeps. -->
  <use href="#inset" stroke="#d8d2c4" stroke-width="1.25" opacity=".88"/>
  <path d="M543 121 C524 151 500 166 474 166 C451 166 428 155 414 139 C340 150 273 216 202 240 V1111 M543 121 C562 151 586 166 612 166 C635 166 658 155 672 139 C746 150 813 216 884 240 V1111 M202 282 C213 246 240 227 267 211 M884 282 C873 246 846 227 819 211 M202 1070 C212 1140 257 1158 345 1172 C445 1188 494 1205 543 1256 C592 1205 641 1188 741 1172 C829 1158 874 1140 884 1070" stroke="#ddd5c6" stroke-width="1.1" opacity=".9"/>
  <!-- Same emblem and silver material as the front, enlarged for the reverse. -->
  <g id="sofacet-logo" transform="translate(543 650) scale(2.56) translate(-543 -1111.5)">
    <use href="#mark" fill="#000" opacity=".7" transform="translate(0 5)"/>
    <use href="#mark" fill="url(#logoSilver)" stroke="#e4e3dc" stroke-width="1.2" filter="url(#brush)"/>
  </g>
</svg>

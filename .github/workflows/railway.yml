name: Railway CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-${{ github.ref }}
  cancel-in-progress: true # Validation only; newer pushes replace obsolete checks.

jobs:
  check:
    name: Build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: git lfs fsck
      - run: npm run build
      - run: node --test --test-concurrency=1 tests/*.test.mjs
      - run: npm run smoke

  video:
    name: ${{ matrix.browser }} mobile video
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: webkit
            os: macos-26 # Native Apple GPU for WebGL; avoid the constrained macOS 15 pool.
          - browser: chromium
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    # Includes the full baseline/current comparison for every mobile video mode.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-check" playwright@1.63.0
          # Hosted runners already include browser system libraries. Avoid slow
          # APT font downloads; keep Playwright's exact pinned browser binaries.
          "$RUNNER_TEMP/browser-check/node_modules/.bin/playwright" install ${{ matrix.browser }}
      - name: Check mobile opening, fast swipes and scroll response
        env:
          SOFACET_PLAYWRIGHT_PATH: ${{ runner.temp }}/browser-check/node_modules/playwright
          SOFACET_BROWSER: ${{ matrix.browser }}
          SOFACET_VIDEO_BASELINE: ce9a0aaa9a412b4a801f74e2e5cf2c8e9a960b99
        run: |
          git fetch --depth 1 origin "$SOFACET_VIDEO_BASELINE"
          node scripts/browser-video-smoke.mjs

  journey:
    name: ${{ matrix.browser }} ${{ matrix.device }} ${{ matrix.native && 'native' || 'auto' }} full R2 journey
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            device: desktop
            os: ubuntu-24.04
          - browser: chromium
            device: mobile
            os: ubuntu-24.04
          - browser: chromium
            device: mobile
            native: true
            os: ubuntu-24.04
          - browser: webkit
            device: mobile
            os: macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-check" playwright@1.63.0
          "$RUNNER_TEMP/browser-check/node_modules/.bin/playwright" install ${{ matrix.browser }}
      - name: Check opening through uninterrupted full journey and game handoff
        env:
          SOFACET_PLAYWRIGHT_PATH: ${{ runner.temp }}/browser-check/node_modules/playwright
          SOFACET_BROWSER: ${{ matrix.browser }}
          SOFACET_DEVICE: ${{ matrix.device }}
          SOFACET_FORCE_NATIVE: ${{ matrix.native && '1' || '0' }}
          MEDIA_CDN_BASE_URL: https://media.sofacet.com
        run: node scripts/browser-journey-flow.mjs

# Railway deploys main through its GitHub repository integration.
# Keep this workflow limited to validation so Wait for CI can complete.

name: Site validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-${{ github.ref }}
  cancel-in-progress: true # Validation only; newer pushes replace obsolete checks.

jobs:
  check:
    name: Build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: git lfs fsck
      - run: npm run build
      - run: node --test --test-concurrency=1 tests/*.test.mjs
      - run: npm run smoke

  entrance:
    name: ${{ matrix.browser }} Three.js entrance
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    # Use the macOS 15 ARM image: macOS 26 ARM failed runner allocation, while
    # Intel VMs lost WebKit's WebGL context before the scene could initialize.
    # Hosted-runner timing remains diagnostic, not an iPhone performance claim.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install isolated entrance browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/entrance-check" playwright@1.63.0
          "$RUNNER_TEMP/entrance-check/node_modules/.bin/playwright" install ${{ matrix.browser }}
      - name: Check automatic iOS quality, shaders, scrolling and rotation
        env:
          SOFACET_PLAYWRIGHT_PATH: ${{ runner.temp }}/entrance-check/node_modules/playwright
          SOFACET_BROWSER: ${{ matrix.browser }}
          SOFACET_ENTRANCE_URL: http://127.0.0.1:8778/
          SOFACET_ENTRANCE_NO_MULTI_DRAW: '1'
          DATA_DIR: ${{ runner.temp }}/entrance-data
          PORT: '8778'
          HOST: 127.0.0.1
        run: |
          node server.mjs > "$RUNNER_TEMP/entrance-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS "${SOFACET_ENTRANCE_URL%/}/health" > /dev/null; then break; fi
            sleep 1
          done
          # Record timing without treating hosted-runner emulation as iPhone certification.
          node scripts/browser-entrance-smoke.mjs
          node scripts/browser-reflection-continuity.mjs
          node scripts/browser-chess-transition.mjs
          node scripts/browser-entrance-video.mjs
          SOFACET_MOTION_URL="$SOFACET_ENTRANCE_URL" SOFACET_CHECK_MOTION=1 node scripts/browser-entrance-motion.mjs
          SOFACET_MOTION_URL="$SOFACET_ENTRANCE_URL" SOFACET_DEVICE='Desktop Chrome' SOFACET_MOTION_CHESS=1 SOFACET_MOTION_NAME=chess-desktop SOFACET_CHECK_MOTION=1 node scripts/browser-entrance-motion.mjs
          node scripts/browser-entrance-clarity.mjs
      - name: Upload entrance measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entrance-${{ matrix.browser }}
          path: |
            work/entrance-performance/
            work/reflections/
            work/chess-transition/
            work/entrance-video/
            work/entrance-motion/
            work/entrance-clarity/
            ${{ runner.temp }}/entrance-server.log
          if-no-files-found: warn
          retention-days: 14

  video:
    name: ${{ matrix.browser }} mobile video
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: webkit
            os: macos-15
          - browser: chromium
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    # Keep functional coverage for the supported /video comparison route.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-check" playwright@1.63.0
          # Hosted runners already include browser system libraries. Avoid slow
          # APT font downloads; keep Playwright's exact pinned browser binaries.
          "$RUNNER_TEMP/browser-check/node_modules/.bin/playwright" install ${{ matrix.browser }}
      - name: Check opt-in performance capture on a production hostname
        env:
          SOFACET_PLAYWRIGHT_PATH: ${{ runner.temp }}/browser-check/node_modules/playwright
          SOFACET_BROWSER: ${{ matrix.browser }}
        run: node scripts/browser-performance-overlay.mjs
      - name: Check denied native playback and trusted-tap recovery
        env:
          SOFACET_PLAYWRIGHT_PATH: ${{ runner.temp }}/browser-check/node_modules/playwright
          SOFACET_BROWSER: ${{ matrix.browser }}
        run: node scripts/browser-native-recovery.mjs

# Validation only: this workflow does not deploy to Railway or Render.
# Historical video timing and experimental worker checks are available through
# the manually dispatched video-performance.yml workflow.

name: WebKit same-runner diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install isolated browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-check" playwright@1.63.0
          "$RUNNER_TEMP/browser-check/node_modules/.bin/playwright" install --with-deps webkit
      - name: Compare original optimization and merged UI without deploying
        env:
          SOFACET_PLAYWRIGHT_PATH: ${{ runner.temp }}/browser-check/node_modules/playwright
          SOFACET_BROWSER: webkit
          SOFACET_DIAGNOSTIC_REFS: 15ea92b921564ba73e5274770e133ecbd013ac87,fca70802059d3345e59ffee97d9f26abadc0c732,86851af30faba61db995ccf504ccc95bc5387fa8
        run: node scripts/browser-video-smoke.mjs

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1022">
  <title>SOFACET — Enter the world</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css?v=pinball-handoff">
  <link rel="preload" as="image" href="./assets/opening-poster.webp">
  <script type="importmap">
    {"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/jsm/"}}
  </script>
</head>
<body data-phase="opening">
  <main aria-label="SOFACET cinematic experience">
    <div id="scene-frame">
      <img id="background" src="./assets/idle-background.webp" width="1920" height="1080" alt="Purple SOFACET building and illuminated walkway at night.">
      <canvas id="ball-canvas" aria-label="Interactive SOFACET ball. Hover over a plate to lift it and its neighbours."></canvas>
      <img id="hold-frame" src="./assets/handoff.webp" width="1920" height="1080" alt="" aria-hidden="true">
      <canvas id="journey-frame" width="1920" height="1080" aria-label="Scroll down to follow the ball; scroll up to move back." hidden></canvas>
      <video id="opening" src="./assets/clip-1.mp4" poster="./assets/opening-poster.webp" muted playsinline preload="auto" aria-label="SOFACET opening animation"></video>
    </div>
    <div class="wordmark" aria-hidden="true">SOFACET</div>
    <header class="site-navigation">
      <a class="play-now" href="./play.html">Play now</a>
      <details id="site-menu">
        <summary aria-label="Navigation menu"><span></span><span></span><span></span></summary>
        <nav aria-label="Main navigation">
          <a href="./about.html">About</a>
          <a href="./privacy.html">Privacy Policies</a>
        </nav>
      </details>
    </header>
    <p id="status" role="status">Loading experience…</p>
    <button id="enter" hidden>Enter SOFACET <span aria-hidden="true">↗</span></button>
    <p id="hint" aria-live="polite"></p>
    <div id="progress" aria-hidden="true"></div>
  </main>
  <div id="blackout" aria-hidden="true"></div>
  <iframe id="game-page" title="SOFACET pinball game" aria-hidden="true" inert></iframe>
  <div id="scroll-space" aria-hidden="true"></div>
  <video id="journey" src="./assets/journey-through-clip6.mp4" muted playsinline preload="metadata" hidden></video>
  <noscript>This experience needs JavaScript to play the opening and explore the ball.</noscript>
  <script type="module" src="./viewer.js?v=pinball-handoff"></script>
  <script type="module" src="./navigation.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SOFACET — Enter the world</title>
  <base href="/">
  <link rel="icon" href="data:,">
  <script>if(location.hash==='#experience')document.documentElement.setAttribute('data-skip-intro','')</script>
  __SHARED_STYLES__
  <style data-entrance-style>__ENTRANCE_CSS__</style>
  <link rel="preload" href="/assets/fonts/sofacet-biarty-regular.otf" as="font" type="font/otf" crossorigin>
</head>
<body data-phase="opening" data-loading>
  __SHARED_LOADER__
  <script type="module" src="__STARTUP_JS__"></script>
  <main id="entrance" aria-label="Explore the SOFACET world" inert aria-hidden="true">
    <div id="scene-viewport">
      <div id="scene-frame" aria-hidden="true"></div>
      <div id="opening-frame"><video id="opening" poster="/assets/opening-poster.webp" muted playsinline webkit-playsinline preload="auto" aria-label="SOFACET fragmented ball assembling"></video></div>
    </div>
    __SHARED_COPY__
    __SHARED_BRAND__
    __SHARED_NAVIGATION__
    __SHARED_ENTER__
    <div id="scene-loading-status"><span data-scene-status role="status">Loading the world…</span><progress data-scene-progress max="100" aria-label="World download"></progress></div>
    <section id="journey-preparation" aria-label="Preparing your journey" hidden>
      <h2>A world taking shape.</h2>
      <p id="preparation-status" data-scene-status role="status">Loading the world…</p>
      <progress data-scene-progress max="100" aria-label="World download"></progress>
      <a href="/play.html">Continue to the game ↗</a>
    </section>
    <button id="scroll-hint" type="button">Scroll to explore <span aria-hidden="true">↓</span></button>
    <div id="progress" aria-hidden="true"></div>
  </main>
  <iframe id="game-page" title="SOFACET pinball game" aria-hidden="true" inert></iframe>
  <div id="scroll-space" aria-hidden="true"></div>
  <noscript><style>#site-loader,#entrance{display:none}</style><a class="play-now" href="/play.html">Play SOFACET</a></noscript>
  __SHARED_NAVIGATION_MODULE__
  <script type="module" src="__ENTRANCE_JS__"></script>
</body>
</html>
